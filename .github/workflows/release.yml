name: Release

# Tag a version to release it: bump "version" in mygo.json, add its section
# to CHANGELOG.md, commit, then `git tag v0.2.0 && git push origin v0.2.0`.
# The jobs build, sign and upload every platform to a draft release, which
# the last job publishes: installed Mac and Windows apps then find the
# update. See https://github.com/egoist/mygo/blob/main/docs/updates.md
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare the draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write # the draft release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check the tag, the version, the notes and the update feed
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("mygo.json"))["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::$TAG is not the version of mygo.json ($version): bump it, with its CHANGELOG.md section, before tagging"
            exit 1
          fi
          feed=$(python3 -c 'import json; print(json.load(open("mygo.json"))["updates"]["github"])')
          if [ "$feed" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::updates.github is $feed, but this is $GITHUB_REPOSITORY: apps read the manifests of the repository in mygo.json"
            exit 1
          fi
          # The update window shows this section as the release notes.
          if ! grep -qE "^## \[?${version//./\\.}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no \"## $version\" section, which the update window shows"
            exit 1
          fi

      - name: Check the key that signs updates
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "::error::Add the key that signs updates, or installed apps cannot update to this release: gh secret set MYGO_UPDATER_PRIVATE_KEY < .update-keys/mygo-update.key"
            exit 1
          fi

      # The release page shows the version's chapter of CHANGELOG.md, as the
      # update window does: one place describes a version.
      - name: Write the notes of the release page
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v"\\]?" {f=1; next} f && /^## / {exit} f' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "Melo $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  # One build job after the other, not side by side: each merges its lines
  # into the release's SHA256SUMS, which concurrent uploads would lose.
  windows-linux:
    name: Windows and Linux
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # the uploads to the draft release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install NSIS, for the Windows installers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis

      # MyGo needs no cgo, so this makes the Windows apps as well.
      - name: Build, sign and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "windows/amd64,windows/arm64,linux/amd64,linux/arm64" -upload

  macos:
    name: macOS
    needs: windows-linux
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write # the uploads to the draft release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build, sign and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "darwin/universal" -upload

  publish:
    name: Publish the release
    needs: [prepare, windows-linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release, which becomes the latest
    steps:
      - name: Check the update manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          printf '%s\n' "$assets"
          # Every target the builds sign must publish its manifest, or its
          # apps would never update.
          for manifest in update-darwin-universal.json update-windows-amd64.json update-windows-arm64.json; do
            if ! grep -qx "$manifest" <<<"$assets"; then
              echo "::error::$GITHUB_REF_NAME holds no $manifest: not publishing a release apps cannot update to"
              exit 1
            fi
          done

      - name: Publish, which installed apps see
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json tagName,url,isDraft --jq '"published \(.url) (\(.tagName), draft: \(.isDraft))"'
