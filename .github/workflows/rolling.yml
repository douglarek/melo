name: Rolling build

# Every push to master builds the platforms and moves the "latest" tag onto a
# prerelease that holds them, which installed apps skip: GitHub's latest
# release, the one their updater reads, is the newest tagged release of
# Release, not this. The prerelease is there to try a build before tagging it.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: rolling-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compute version
        id: version
        run: |
          base=$(python3 -c 'import json; print(json.load(open("mygo.json"))["version"])')
          base=$(printf '%s' "$base" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          ts=$(git show -s --format=%cd --date=format:%Y%m%d%H%M%S HEAD)
          sha=$(git rev-parse --short=7 HEAD)
          echo "version=${base}.${ts}git.${sha}" >> "$GITHUB_OUTPUT"

  macos:
    name: Build macOS DMG
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Set build version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          path = "mygo.json"
          with open(path) as f:
              cfg = json.load(f)
          cfg["version"] = os.environ["VERSION"]
          with open(path, "w") as f:
              json.dump(cfg, f, indent=2)
              f.write("\n")
          PY
          grep '"version"' mygo.json

      # No signing identity on a runner: ad hoc signed, as the released app,
      # so that it still opens.
      - name: Build universal DMG
        run: go tool mygo build -platform darwin/universal -skip-notarize

      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: build/darwin-universal/*.dmg
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Build Linux and Windows packages
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Set build version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          path = "mygo.json"
          with open(path) as f:
              cfg = json.load(f)
          cfg["version"] = os.environ["VERSION"]
          with open(path, "w") as f:
              json.dump(cfg, f, indent=2)
              f.write("\n")
          PY
          grep '"version"' mygo.json

      - name: Install NSIS, for the Windows installers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis

      - name: Build amd64 and arm64 packages, and the Windows ones
        run: |
          go tool mygo build -platform linux/amd64
          go tool mygo build -platform linux/arm64
          go tool mygo build -platform windows/amd64
          go tool mygo build -platform windows/arm64

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build/linux-amd64/*.tar.gz
            build/linux-amd64/*.deb
            build/linux-arm64/*.tar.gz
            build/linux-arm64/*.deb
            build/windows-amd64/*-setup-*.exe
            build/windows-arm64/*-setup-*.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the rolling prerelease
    needs: [prepare, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check packages
        run: |
          count=$(find dist -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.deb' -o -name '*-setup-*.exe' \) | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "no packages were downloaded" >&2
            exit 1
          fi
          find dist -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.deb' -o -name '*-setup-*.exe' \) -print

      - name: Move the rolling tag
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest

      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "Rolling build ${VERSION} from ${GITHUB_SHA}."
            echo
            echo "- macOS: universal DMG (ad-hoc signed, not notarized; right-click > Open if Gatekeeper blocks)"
            echo "- Linux: amd64 and arm64 tar.gz and .deb"
            echo "- Windows: amd64 and arm64 installers"
            echo
            echo "This is a prerelease: installed apps update to the tagged releases of Release, not to this."
            echo
            echo "Source: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          } > "$RUNNER_TEMP/notes.md"

          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag=false
          fi
          gh release create latest --title "Rolling (${VERSION})" \
            --verify-tag --prerelease --notes-file "$RUNNER_TEMP/notes.md"

          find dist -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.deb' -o -name '*-setup-*.exe' \) -print0 \
            | xargs -0 -r gh release upload latest --clobber

          gh release view latest --json assets --jq '.assets[].name'
