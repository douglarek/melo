<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Vibrant Apple/YouTube Red Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#FF3850"/>
      <stop offset="35%" stop-color="#FF1A38"/>
      <stop offset="70%" stop-color="#E60026"/>
      <stop offset="100%" stop-color="#BA001A"/>
    </linearGradient>

    <!-- Top Bevel Highlight for Squircle -->
    <linearGradient id="topBevel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Outer Sonic Halo Glow -->
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ff6680" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff002b" stop-opacity="0"/>
    </radialGradient>

    <!-- Luminous Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FFE8EC"/>
      <stop offset="100%" stop-color="#FFC2CC"/>
    </linearGradient>

    <!-- Inner Disc Gradient -->
    <radialGradient id="discGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FF4D64"/>
      <stop offset="45%" stop-color="#ED0429"/>
      <stop offset="85%" stop-color="#B80018"/>
      <stop offset="100%" stop-color="#80000D"/>
    </radialGradient>

    <!-- Center Play Button Gradient -->
    <linearGradient id="playGrad" x1="0" x2="0.6" y1="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F0F2"/>
    </linearGradient>

    <!-- Gloss Arc Highlight -->
    <linearGradient id="glossGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="ringShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#59000a" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="discShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4d0008" flood-opacity="0.7"/>
    </filter>

    <filter id="playShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#400006" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

    <!-- macOS Standard Squircle Path -->
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <!-- 1. Squircle Canvas -->
  <g clip-path="url(#squircle)">
    <!-- Base Vibrant Red Gradient -->
    <rect width="1024" height="1024" fill="url(#bgGrad)"/>
    
    <!-- Top Diagonal Glass Glare -->
    <path d="M 0,0 L 1024,0 L 1024,280 C 680,180 340,180 0,280 Z" fill="#ffffff" opacity="0.12"/>
    
    <!-- Subtle Inner Border Highlight -->
    <rect width="1024" height="1024" rx="224" ry="224" fill="none" stroke="url(#topBevel)" stroke-width="4"/>

    <!-- 2. Ambient Sonic Aura behind YouTube Music Emblem -->
    <circle cx="512" cy="512" r="440" fill="url(#haloGlow)"/>

    <!-- Delicate Acoustic Resonance Rings in Background -->
    <circle cx="512" cy="512" r="375" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
    <circle cx="512" cy="512" r="415" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>

    <!-- 3. YouTube Music Iconic Outer Ring (Dimensional, Luminous) -->
    <g filter="url(#ringShadow)">
      <!-- Outer Sound Ring (White / Platinum) -->
      <circle cx="512" cy="512" r="270" fill="none" stroke="url(#ringGrad)" stroke-width="48"/>
      <!-- Soft Ring Inner Rim Reflection -->
      <circle cx="512" cy="512" r="294" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
      <circle cx="512" cy="512" r="246" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    </g>

    <!-- 4. YouTube Music Floating Inner Ruby Disc -->
    <g filter="url(#discShadow)">
      <circle cx="512" cy="512" r="192" fill="url(#discGrad)"/>
      <!-- Disc Perimeter Light Reflection -->
      <circle cx="512" cy="512" r="191" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="2"/>
      <circle cx="512" cy="512" r="189" fill="none" stroke="#ff8093" stroke-opacity="0.2" stroke-width="1.5"/>
    </g>

    <!-- Disc Glass Specular Arc -->
    <path d="M 335,466 C 362,382 430,336 512,336 C 594,336 662,382 689,466 C 632,430 572,412 512,412 C 452,412 392,430 335,466 Z" 
          fill="url(#glossGrad)" opacity="0.42"/>

    <!-- 5. Iconic Play Triangle (Pristine, Pure White with Soft Rounded Corners) -->
    <g filter="url(#playShadow)">
      <path d="M 454,392 C 454,378 470,370 482,377 L 626,467 C 638,474 638,492 626,499 L 482,589 C 470,596 454,588 454,574 Z" 
            fill="url(#playGrad)"/>
      <!-- Play Triangle Top Specular Glint -->
      <path d="M 454,410 L 454,392 C 454,378 470,370 482,377 L 550,420 C 510,430 480,440 454,455 Z" 
            fill="#ffffff" opacity="0.5"/>
    </g>
  </g>
</svg>